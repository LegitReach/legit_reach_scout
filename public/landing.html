  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"0743c90a-6103-498d-bf76-d71897b22a4b\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <script type=\"module\">\n    import { playhtml } from \"https://unpkg.com/playhtml@latest\";\n    playhtml.init();\n    window.playhtml = playhtml;\n  <\u002Fscript>\n  \n  <style>\n    html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }\n    a { color: #ffffff; text-decoration: none; }\n    a:hover { color: #ffffff; }\n    * { box-sizing: border-box; }\n    @keyframes lr-fade-up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }\n    @keyframes lr-fade { from { opacity: 0; } to { opacity: 1; } }\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div id=\"lr-screen\" data-screen-label=\"LegitReach Landing\" style=\"position: fixed; inset: 0; background: #000; color: #fff; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; overflow: hidden;\">\n\n  <canvas ref=\"{{ canvasRef }}\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; display: block;\"><\u002Fcanvas>\n\n  <svg width=\"0\" height=\"0\" style=\"position: absolute;\" aria-hidden=\"true\">\n    <defs>\n      <filter id=\"lr-cr\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\">\n        <feTurbulence type=\"fractalNoise\" sc-camel-base-frequency=\"0.035\" sc-camel-num-octaves=\"3\" seed=\"7\" result=\"n\"><\u002FfeTurbulence>\n        <feDisplacementMap in=\"SourceGraphic\" in2=\"n\" scale=\"7\"><\u002FfeDisplacementMap>\n      <\u002Ffilter>\n    <\u002Fdefs>\n  <\u002Fsvg>\n\n  <div ref=\"{{ sketchARef }}\" style=\"position: absolute; left: -999px; top: -999px; transform: translate(-50%, -50%);\">\n    <div id=\"lr-sketch-a\" can-move=\"\" can-move-bounds=\"#lr-screen\" style=\"cursor: grab; touch-action: none;\">\n    <svg sc-camel-view-box=\"0 0 220 170\" fill=\"none\" style=\"display: block; width: clamp(88px, 15vw, 210px); height: auto; opacity: 0.9; pointer-events: none;\">\n      <g filter=\"url(#lr-cr)\" stroke-linecap=\"round\" fill=\"none\">\n        <circle cx=\"106\" cy=\"86\" r=\"32\" stroke=\"#FF9A3D\" stroke-width=\"4\"><\u002Fcircle>\n        <path d=\"M98 62 q 10 8 18 2 M88 96 q 12 9 26 1\" stroke=\"#FF9A3D\" stroke-width=\"3\"><\u002Fpath>\n        <ellipse cx=\"106\" cy=\"86\" rx=\"62\" ry=\"17\" transform=\"rotate(-18 106 86)\" stroke=\"#5BE7FF\" stroke-width=\"3.5\"><\u002Fellipse>\n        <path d=\"M182 30 l0 14 M175 37 l14 0\" stroke=\"#FFD84D\" stroke-width=\"3.5\"><\u002Fpath>\n      <\u002Fg>\n    <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div ref=\"{{ sketchBRef }}\" style=\"position: absolute; left: -999px; top: -999px; transform: translate(-50%, -50%);\">\n    <div id=\"lr-sketch-b\" can-move=\"\" can-move-bounds=\"#lr-screen\" style=\"cursor: grab; touch-action: none;\">\n    <svg sc-camel-view-box=\"0 0 190 160\" fill=\"none\" style=\"display: block; width: clamp(80px, 13vw, 180px); height: auto; opacity: 0.9; pointer-events: none;\">\n      <g filter=\"url(#lr-cr)\" stroke-linecap=\"round\" fill=\"none\">\n        <circle cx=\"86\" cy=\"84\" r=\"36\" stroke=\"#7CFF6B\" stroke-width=\"4\"><\u002Fcircle>\n        <path d=\"M62 76 q 13 10 26 2 q 12 -8 25 4\" stroke=\"#7CFF6B\" stroke-width=\"3\"><\u002Fpath>\n        <path d=\"M74 102 q 10 7 22 1\" stroke=\"#5BE7FF\" stroke-width=\"3\"><\u002Fpath>\n        <path d=\"M148 30 l0 12 M142 36 l12 0\" stroke=\"#FFD84D\" stroke-width=\"3\"><\u002Fpath>\n      <\u002Fg>\n    <\u002Fsvg>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: clamp(20px, 4vh, 44px) 24px; pointer-events: none;\">\n\n    <div style=\"display: flex; align-items: center; gap: 10px; opacity: 0.001; animation: lr-fade 1.6s ease 0.2s forwards;\">\n      <svg sc-camel-view-box=\"0 0 1024 1024\" width=\"18\" height=\"18\" aria-hidden=\"true\">\n        <defs>\n          <mask id=\"lr-cut-top\">\n            <rect width=\"1024\" height=\"1024\" fill=\"white\"><\u002Frect>\n            <line x1=\"-50\" y1=\"420\" x2=\"1074\" y2=\"820\" stroke=\"black\" stroke-width=\"64\"><\u002Fline>\n          <\u002Fmask>\n        <\u002Fdefs>\n        <polygon points=\"512,183 132,841 892,841\" fill=\"#ffffff\" mask=\"url(#lr-cut-top)\"><\u002Fpolygon>\n      <\u002Fsvg>\n      <span style=\"font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.42em; color: rgba(255,255,255,0.5);\">LEGITREACH<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; flex-direction: column; align-items: center; text-align: center; gap: clamp(18px, 3.2vh, 30px); opacity: 0.001; animation: lr-fade-up 1.4s cubic-bezier(0.16,1,0.3,1) 0.5s forwards;\">\n      <button type=\"button\" sc-camel-on-click=\"{{ resetPlanets }}\" aria-label=\"Reset planet positions\" title=\"Reset planet positions\" style=\"display: inline-flex; background: none; border: none; padding: 10px; margin: -10px; cursor: pointer; pointer-events: auto; -webkit-tap-highlight-color: transparent; transition: transform 0.35s ease;\" style-hover=\"transform: scale(1.08);\">\n        <svg sc-camel-view-box=\"0 0 1024 1024\" style=\"display: block; width: clamp(56px, 9vh, 88px); height: clamp(56px, 9vh, 88px); filter: drop-shadow(0 0 28px rgba(255,255,255,0.18));\" aria-hidden=\"true\">\n          <defs>\n            <mask id=\"lr-cut-main\">\n              <rect width=\"1024\" height=\"1024\" fill=\"white\"><\u002Frect>\n              <line x1=\"-50\" y1=\"420\" x2=\"1074\" y2=\"820\" stroke=\"black\" stroke-width=\"54\"><\u002Fline>\n            <\u002Fmask>\n          <\u002Fdefs>\n          <polygon points=\"512,183 132,841 892,841\" fill=\"#ffffff\" mask=\"url(#lr-cut-main)\"><\u002Fpolygon>\n        <\u002Fsvg>\n      <\u002Fbutton>\n      <h1 style=\"margin: 0; font-size: clamp(34px, 5.4vw, 64px); font-weight: 700; letter-spacing: -0.03em; line-height: 1;\">LegitReach<\u002Fh1>\n      <p style=\"margin: 0; max-width: 88vw; line-height: 1.9; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: clamp(10px, 1.3vw, 12px); letter-spacing: clamp(0.22em, 1vw, 0.38em); color: rgba(255,255,255,0.55); text-transform: uppercase;\">Deep space communication using photons<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; gap: clamp(12px, 2vw, 18px); pointer-events: auto; opacity: 0.001; animation: lr-fade-up 1.4s cubic-bezier(0.16,1,0.3,1) 0.9s forwards;\">\n      <a href=\"#\" sc-camel-on-click=\"{{ openModal }}\" style=\"display: inline-flex; align-items: center; justify-content: center; min-width: clamp(118px, 34vw, 168px); padding: 15px clamp(16px, 3vw, 30px); border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.32em; color: #fff; text-indent: 0.32em; transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease;\" style-hover=\"background: #ffffff; color: #000000; border-color: #ffffff;\">PROTOTYPE<\u002Fa>\n      <a href=\"#\" sc-camel-on-click=\"{{ openDeck }}\" style=\"display: inline-flex; align-items: center; justify-content: center; min-width: clamp(118px, 34vw, 168px); padding: 15px clamp(16px, 3vw, 30px); border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.32em; color: #fff; text-indent: 0.32em; transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease;\" style-hover=\"background: #ffffff; color: #000000; border-color: #ffffff;\">KNOW MORE<\u002Fa>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ modalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeModal }}\" style=\"position: absolute; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 10; animation: lr-fade 0.35s ease;\">\n      <div sc-camel-on-click=\"{{ stopClick }}\" data-screen-label=\"Project MiniReach Modal\" style=\"position: relative; width: min(94vw, 620px); max-height: 88vh; overflow: auto; background: rgba(6,6,8,0.92); border: 1px solid rgba(255,255,255,0.16); border-radius: 24px; padding: clamp(28px, 5vw, 52px); display: block; animation: lr-fade-up 0.5s cubic-bezier(0.16,1,0.3,1);\">\n\n        <button sc-camel-on-click=\"{{ closeModal }}\" aria-label=\"Close\" style=\"position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: rgba(255,255,255,0.7); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s ease, color 0.3s ease;\" style-hover=\"background: #ffffff; color: #000000;\">\u00d7<\u002Fbutton>\n\n        <div style=\"display: flex; flex-direction: column; gap: clamp(20px, 3vh, 28px);\">\n        <div style=\"display: flex; flex-direction: column; gap: 12px;\">\n          <span style=\"font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.42em; color: rgba(255,255,255,0.5);\">PROJECT MINIREACH<\u002Fspan>\n          <h2 style=\"margin: 0; font-size: clamp(22px, 3.4vw, 32px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; color: #fff;\">1/1,000,000<sup style=\"font-size: 0.5em;\">th<\u002Fsup> the budget of NASA's DSOC.<\u002Fh2>\n          <p style=\"margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.22em; color: rgba(255,255,255,0.55);\">EMULATING DSOC'S ACTUAL INNOVATIONS \u00b7 ~$3\u201310K<\u002Fp>\n        <\u002Fdiv>\n\n        <p style=\"margin: 0; font-size: 15px; line-height: 1.65; color: rgba(255,255,255,0.72); text-wrap: pretty;\">What made DSOC special was photon-counting pulse-position modulation (PPM) and beacon-assisted pointing. MiniReach replicates it at small scale: a SPAD single-photon detector (~$1\u20133k used), PPM + error-correction coding in GNU Radio, and a camera + gimbal that locks onto a beacon LED from the far end.<\u002Fp>\n\n        <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; overflow: hidden;\">\n          <div style=\"background: #060608; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 9px; letter-spacing: 0.3em; color: rgba(255,255,255,0.4);\">DETECT<\u002Fspan>\n            <span style=\"font-size: 13px; color: #fff; line-height: 1.4;\">SPAD single-photon detector<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background: #060608; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 9px; letter-spacing: 0.3em; color: rgba(255,255,255,0.4);\">ENCODE<\u002Fspan>\n            <span style=\"font-size: 13px; color: #fff; line-height: 1.4;\">PPM + ECC in GNU Radio<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"background: #060608; padding: 16px 14px; display: flex; flex-direction: column; gap: 6px;\">\n            <span style=\"font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 9px; letter-spacing: 0.3em; color: rgba(255,255,255,0.4);\">POINT<\u002Fspan>\n            <span style=\"font-size: 13px; color: #fff; line-height: 1.4;\">Camera + gimbal on beacon LED<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background: #FCFCFB; border-radius: 14px; padding: clamp(14px, 2.5vw, 22px);\">\n          <img src=\"da985a62-d120-46dd-871c-3a8c5a619885\" alt=\"Laser communication terminal architecture\" style=\"display: block; width: 100%; height: auto;\">\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; gap: clamp(16px, 3vw, 28px);\">\n          <div style=\"display: flex; align-items: center; gap: 18px; flex: 1;\">\n            <div style=\"width: 72px; height: 40px;\">\n              <x-import component-from-global-scope=\"image-slot\" from=\"e87d83aa-cd11-463d-a0e1-e1860c33732e#/image-slot.js\" id=\"logo-nasa\" shape=\"rounded\" radius=\"8\" fit=\"contain\" placeholder=\"NASA logo\" hint-size=\"72px,40px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"width: 72px; height: 40px;\">\n              <x-import component-from-global-scope=\"image-slot\" from=\"e87d83aa-cd11-463d-a0e1-e1860c33732e#/image-slot.js\" id=\"logo-jpl\" shape=\"rounded\" radius=\"8\" fit=\"contain\" placeholder=\"JPL logo\" hint-size=\"72px,40px\"><\u002Fx-import>\n            <\u002Fdiv>\n            <div style=\"width: 72px; height: 40px;\">\n              <x-import component-from-global-scope=\"image-slot\" from=\"e87d83aa-cd11-463d-a0e1-e1860c33732e#/image-slot.js\" id=\"logo-dsoc\" shape=\"rounded\" radius=\"8\" fit=\"contain\" placeholder=\"DSOC logo\" hint-size=\"72px,40px\"><\u002Fx-import>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-top: 1px solid rgba(255,255,255,0.12); padding-top: clamp(18px, 3vh, 24px);\">\n          <div style=\"display: flex; align-items: center; gap: 10px;\">\n            <span style=\"width: 7px; height: 7px; border-radius: 999px; background: #ffffff; box-shadow: 0 0 10px rgba(255,255,255,0.8); animation: lr-fade 1.4s ease infinite alternate;\"><\u002Fspan>\n            <span style=\"font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.3em; color: rgba(255,255,255,0.75);\">PROJECT STAGE \u00b7 INVENTORY IN ORDER<\u002Fspan>\n          <\u002Fdiv>\n          <span style=\"display: inline-flex; align-items: center; gap: 10px; padding: 11px 20px; border: 1px dashed rgba(255,255,255,0.25); border-radius: 999px; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.28em; color: rgba(255,255,255,0.45);\">SOURCE CODE \u00b7 GITHUB \u00b7 COMING SOON<\u002Fspan>\n        <\u002Fdiv>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ deckOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeDeck }}\" style=\"position: absolute; inset: 0; background: rgba(0,0,0,0.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); display: flex; align-items: center; justify-content: center; padding: clamp(12px, 3vw, 32px); z-index: 10; animation: lr-fade 0.35s ease;\">\n      <div sc-camel-on-click=\"{{ stopClick }}\" data-screen-label=\"Pitch Deck Modal\" style=\"position: relative; width: min(96vw, 1100px); height: 90vh; background: #000; border: 1px solid rgba(255,255,255,0.16); border-radius: 24px; overflow: hidden; display: flex; flex-direction: column; animation: lr-fade-up 0.5s cubic-bezier(0.16,1,0.3,1);\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.12); flex-shrink: 0; flex-wrap: wrap;\">\n          <span style=\"font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.36em; color: rgba(255,255,255,0.55);\">LEGITREACH \u00b7 PITCH DECK<\u002Fspan>\n          <div style=\"display: flex; align-items: center; gap: 10px;\">\n            <button sc-camel-on-click=\"{{ printDeck }}\" style=\"display: inline-flex; align-items: center; padding: 9px 18px; border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; background: transparent; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 0.24em; color: #fff; cursor: pointer; transition: background 0.3s ease, color 0.3s ease;\" style-hover=\"background: #ffffff; color: #000000;\">DOWNLOAD PDF<\u002Fbutton>\n            <button sc-camel-on-click=\"{{ closeDeck }}\" aria-label=\"Close\" style=\"width: 32px; height: 32px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: rgba(255,255,255,0.7); font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.3s ease, color 0.3s ease;\" style-hover=\"background: #ffffff; color: #000000;\">\u00d7<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <iframe ref=\"{{ deckFrameRef }}\" src=\"0255fabc-7ac8-4bde-9202-62a019c3c8d8\" title=\"LegitReach Pitch Deck\" style=\"flex: 1; width: 100%; border: none; background: #000;\"><\u002Fiframe>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;photonSpeed&quot;: { &quot;editor&quot;: &quot;range&quot;, &quot;default&quot;: 1, &quot;min&quot;: 0.3, &quot;max&quot;: 3, &quot;step&quot;: 0.1, &quot;tsType&quot;: &quot;number&quot;, &quot;section&quot;: &quot;Animation&quot; }\n}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.canvas = null;\n    this.raf = 0;\n    this.photons = [];\n    this.stars = [];\n    this.t0 = performance.now();\n  }\n\n  state = { modalOpen: false, deckOpen: false };\n\n  renderVals() {\n    return {\n      modalOpen: this.state.modalOpen,\n      deckOpen: this.state.deckOpen,\n      openDeck: (e) => { e.preventDefault(); this.setState({ deckOpen: true }); },\n      closeDeck: (e) => { e.preventDefault(); this.setState({ deckOpen: false }); },\n      deckFrameRef: (el) => { this.deckFrame = el; },\n      sketchARef: (el) => { this.sketchA = el; this.placeSketches(); if (el) this.registerPlay(el.firstElementChild); },\n      sketchBRef: (el) => { this.sketchB = el; this.placeSketches(); if (el) this.registerPlay(el.firstElementChild); },\n      printDeck: () => {\n        try {\n          this.deckFrame && this.deckFrame.contentWindow && this.deckFrame.contentWindow.print();\n        } catch (err) {\n          window.open('deck.html', '_blank');\n        }\n      },\n      openModal: (e) => { e.preventDefault(); this.setState({ modalOpen: true }); },\n      closeModal: (e) => { e.preventDefault(); this.setState({ modalOpen: false }); },\n      stopClick: (e) => { e.stopPropagation(); },\n      resetPlanets: (e) => {\n        e && e.preventDefault();\n        const ph = window.playhtml;\n        if (!ph || typeof ph.getHandle !== 'function') return;\n        ph.getHandle('lr-sketch-a', 'can-move').setData({ x: 0, y: 0 });\n        ph.getHandle('lr-sketch-b', 'can-move').setData({ x: 0, y: 0 });\n      },\n      canvasRef: (el) => {\n        if (el && el !== this.canvas) {\n          this.canvas = el;\n          this.setup();\n        }\n      }\n    };\n  }\n\n  componentWillUnmount() {\n    cancelAnimationFrame(this.raf);\n    window.removeEventListener('resize', this._onResize);\n  }\n\n  setup() {\n    const c = this.canvas;\n    this._onResize = () => this.resize();\n    window.addEventListener('resize', this._onResize);\n    this.resize();\n    cancelAnimationFrame(this.raf);\n    const loop = (now) => {\n      this.draw(now);\n      this.raf = requestAnimationFrame(loop);\n    };\n    this.raf = requestAnimationFrame(loop);\n  }\n\n  resize() {\n    const c = this.canvas;\n    if (!c) return;\n    const dpr = Math.min(window.devicePixelRatio || 1, 2);\n    this.w = c.clientWidth;\n    this.h = c.clientHeight;\n    c.width = Math.round(this.w * dpr);\n    c.height = Math.round(this.h * dpr);\n    this.ctx = c.getContext('2d');\n    this.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);\n    // regenerate stars\n    const n = Math.round((this.w * this.h) / 3800);\n    this.stars = [];\n    for (let i = 0; i < n; i++) {\n      this.stars.push({\n        x: Math.random() * this.w,\n        y: Math.random() * this.h,\n        r: Math.random() < 0.9 ? Math.random() * 0.8 + 0.2 : Math.random() * 1.5 + 0.8,\n        a: Math.random() * 0.5 + 0.08,\n        ph: Math.random() * Math.PI * 2,\n        sp: Math.random() * 0.9 + 0.25\n      });\n    }\n    // endpoints: two nodes, diagonal across the screen. Fractions are mapped\n    // into a safe zone inset by each planet's own half-size (see safePoint),\n    // so neither ever renders partly off-screen on narrow viewports.\n    const portrait = this.h > this.w;\n    if (portrait) {\n      this.fracA = { x: 0.16, y: 0.20 };\n      this.fracB = { x: 0.84, y: 0.80 };\n      this.C1 = { x: this.w * 0.95, y: this.h * 0.38 };\n      this.C2 = { x: this.w * 0.05, y: this.h * 0.62 };\n    } else {\n      this.fracA = { x: 0.09, y: 0.30 };\n      this.fracB = { x: 0.91, y: 0.72 };\n      this.C1 = { x: this.w * 0.38, y: this.h * 0.02 };\n      this.C2 = { x: this.w * 0.62, y: this.h * 1.00 };\n    }\n    this.placeSketches();\n    // a resize/rotation can leave a previously-dragged planet's persisted\n    // offset pointing off the new, smaller viewport \u2014 pull it back in.\n    this.clampDraggedToViewport();\n  }\n\n  registerPlay(el, tries) {\n    tries = tries || 0;\n    if (!el || el._playReg) return;\n    if (window.playhtml && window.playhtml.setupPlayElement) {\n      el._playReg = true;\n      try { window.playhtml.setupPlayElement(el); } catch (err) {}\n    } else if (tries < 20) {\n      setTimeout(() => this.registerPlay(el, tries + 1), 500);\n    }\n  }\n\n  // Maps a 0-1 fraction into a rect inset by the element's own half-size\n  // (plus a fixed margin), so the returned point always keeps the whole\n  // element on-screen regardless of viewport size.\n  safePoint(frac, wrapEl, fallbackW, fallbackH) {\n    const margin = 14;\n    const el = wrapEl && wrapEl.firstElementChild;\n    const bw = (el && el.offsetWidth) || fallbackW;\n    const bh = (el && el.offsetHeight) || fallbackH;\n    const halfW = bw / 2, halfH = bh / 2;\n    const minX = halfW + margin, maxX = Math.max(minX, this.w - halfW - margin);\n    const minY = halfH + margin, maxY = Math.max(minY, this.h - halfH - margin);\n    return {\n      x: minX + frac.x * (maxX - minX),\n      y: minY + frac.y * (maxY - minY)\n    };\n  }\n\n  placeSketches() {\n    if (!this.w || !this.h) return;\n    if (this.fracA && this.sketchA) {\n      this.A = this.safePoint(this.fracA, this.sketchA, 210, 170);\n      this.sketchA.style.left = this.A.x + 'px';\n      this.sketchA.style.top = this.A.y + 'px';\n    }\n    if (this.fracB && this.sketchB) {\n      this.B = this.safePoint(this.fracB, this.sketchB, 180, 160);\n      this.sketchB.style.left = this.B.x + 'px';\n      this.sketchB.style.top = this.B.y + 'px';\n    }\n  }\n\n  // Pulls a planet's synced drag offset back within the viewport when the\n  // combined (base + offset) position has drifted out of bounds \u2014 e.g. a\n  // resize/rotation, or a collaborator's offset syncing in from a wider\n  // screen. can-move-bounds already prevents this during an active drag;\n  // this covers the cases that happen outside of one.\n  clampDraggedToViewport() {\n    const ph = window.playhtml;\n    if (!ph || typeof ph.getHandle !== 'function') return;\n    this._clampHandle('lr-sketch-a', this.sketchA);\n    this._clampHandle('lr-sketch-b', this.sketchB);\n  }\n\n  _clampHandle(id, wrapEl) {\n    if (!this.canvas || !wrapEl) return;\n    const el = wrapEl.firstElementChild;\n    if (!el) return;\n    const handle = window.playhtml.getHandle(id, 'can-move');\n    const data = handle.getData();\n    if (!data) return;\n    const margin = 14;\n    const rect = el.getBoundingClientRect();\n    const cr = this.canvas.getBoundingClientRect();\n    const left = rect.left - cr.left, right = rect.right - cr.left;\n    const top = rect.top - cr.top, bottom = rect.bottom - cr.top;\n    let dx = 0, dy = 0;\n    if (left < margin) dx = margin - left;\n    else if (right > this.w - margin) dx = (this.w - margin) - right;\n    if (top < margin) dy = margin - top;\n    else if (bottom > this.h - margin) dy = (this.h - margin) - bottom;\n    if (dx || dy) {\n      handle.setData({\n        x: Math.round((data.x + dx) * 10) / 10,\n        y: Math.round((data.y + dy) * 10) / 10\n      });\n    }\n  }\n\n  updateEndpoints() {\n    const cr = this.canvas.getBoundingClientRect();\n    const cen = (w) => {\n      const el = w && w.firstElementChild;\n      if (!el) return null;\n      const r = el.getBoundingClientRect();\n      return { x: r.left + r.width / 2 - cr.left, y: r.top + r.height / 2 - cr.top };\n    };\n    this.eA = cen(this.sketchA) || this.A;\n    this.eB = cen(this.sketchB) || this.B;\n    const dx = this.eB.x - this.eA.x, dy = this.eB.y - this.eA.y, k = 0.25;\n    this.eC1 = { x: this.eA.x + dx * 0.33 - dy * k, y: this.eA.y + dy * 0.33 + dx * k };\n    this.eC2 = { x: this.eA.x + dx * 0.66 + dy * k, y: this.eA.y + dy * 0.66 - dx * k };\n  }\n\n  bez(t) {\n    const A = this.eA, B = this.eB, C1 = this.eC1, C2 = this.eC2;\n    const u = 1 - t;\n    return {\n      x: u*u*u*A.x + 3*u*u*t*C1.x + 3*u*t*t*C2.x + t*t*t*B.x,\n      y: u*u*u*A.y + 3*u*u*t*C1.y + 3*u*t*t*C2.y + t*t*t*B.y\n    };\n  }\n\n  spawnPhoton(now, dir) {\n    const speed = (this.props.photonSpeed ?? 1) * (0.9 + Math.random() * 0.35);\n    this.photons.push({ t: dir > 0 ? 0 : 1, dir, speed, born: now, size: 1.4 + Math.random() * 1.2 });\n  }\n\n  drawNode(ctx, p, now, phase) {\n    const pulse = 0.5 + 0.5 * Math.sin(now / 1400 + phase);\n    // halo \u2014 distant galaxy glow\n    let g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 90);\n    g.addColorStop(0, 'rgba(255,255,255,' + (0.20 + pulse * 0.08) + ')');\n    g.addColorStop(0.25, 'rgba(255,255,255,0.06)');\n    g.addColorStop(1, 'rgba(255,255,255,0)');\n    ctx.fillStyle = g;\n    ctx.beginPath(); ctx.arc(p.x, p.y, 90, 0, Math.PI * 2); ctx.fill();\n    // core\n    ctx.fillStyle = 'rgba(255,255,255,0.95)';\n    ctx.beginPath(); ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2); ctx.fill();\n    // expanding ring\n    const rt = ((now / 3600 + phase) % 1);\n    const rr = 6 + rt * 64;\n    ctx.strokeStyle = 'rgba(255,255,255,' + (0.28 * (1 - rt)) + ')';\n    ctx.lineWidth = 1;\n    ctx.beginPath(); ctx.arc(p.x, p.y, rr, 0, Math.PI * 2); ctx.stroke();\n    // fine orbit ring\n    ctx.strokeStyle = 'rgba(255,255,255,0.12)';\n    ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI * 2); ctx.stroke();\n  }\n\n  draw(now) {\n    const ctx = this.ctx;\n    if (!ctx) return;\n    const { w, h } = this;\n    ctx.clearRect(0, 0, w, h);\n\n    // deep space vignette\n    let vg = ctx.createRadialGradient(w/2, h/2, Math.min(w,h)*0.1, w/2, h/2, Math.max(w,h)*0.75);\n    vg.addColorStop(0, 'rgba(10,10,12,0)');\n    vg.addColorStop(1, 'rgba(0,0,0,0.55)');\n\n    // stars\n    for (const s of this.stars) {\n      const tw = 0.55 + 0.45 * Math.sin(now / 900 * s.sp + s.ph);\n      ctx.fillStyle = 'rgba(255,255,255,' + (s.a * tw) + ')';\n      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();\n    }\n\n    // periodic boundary check \u2014 catches a collaborator's offset syncing in\n    // late from a wider screen (resize() already handles local resizes).\n    if (!this._lastClamp || now - this._lastClamp > 900) {\n      this._lastClamp = now;\n      this.clampDraggedToViewport();\n    }\n\n    // beam path \u2014 faint, follows the planets live\n    this.updateEndpoints();\n    ctx.strokeStyle = 'rgba(255,255,255,0.07)';\n    ctx.lineWidth = 1;\n    ctx.beginPath();\n    ctx.moveTo(this.eA.x, this.eA.y);\n    ctx.bezierCurveTo(this.eC1.x, this.eC1.y, this.eC2.x, this.eC2.y, this.eB.x, this.eB.y);\n    ctx.stroke();\n\n    // spawn photons at a slow, elegant cadence\n    if (!this._lastSpawn || now - this._lastSpawn > 2600 / (this.props.photonSpeed ?? 1)) {\n      this._lastSpawn = now;\n      this.spawnPhoton(now, this._flip ? -1 : 1);\n      this._flip = !this._flip;\n    }\n\n    // photons with trailing glow\n    const dt = 0.00016;\n    this.photons = this.photons.filter(p => p.t >= -0.02 && p.t <= 1.02);\n    for (const p of this.photons) {\n      p.t += p.dir * dt * p.speed * 16;\n      const pos = this.bez(Math.max(0, Math.min(1, p.t)));\n      // trail\n      const steps = 14;\n      for (let i = 1; i <= steps; i++) {\n        const tt = p.t - p.dir * i * 0.012;\n        if (tt < 0 || tt > 1) continue;\n        const q = this.bez(tt);\n        const a = 0.35 * (1 - i / steps);\n        ctx.fillStyle = 'rgba(255,255,255,' + a + ')';\n        ctx.beginPath(); ctx.arc(q.x, q.y, p.size * (1 - i / (steps + 4)), 0, Math.PI * 2); ctx.fill();\n      }\n      // head glow\n      let hg = ctx.createRadialGradient(pos.x, pos.y, 0, pos.x, pos.y, 18);\n      hg.addColorStop(0, 'rgba(255,255,255,0.9)');\n      hg.addColorStop(0.2, 'rgba(255,255,255,0.25)');\n      hg.addColorStop(1, 'rgba(255,255,255,0)');\n      ctx.fillStyle = hg;\n      ctx.beginPath(); ctx.arc(pos.x, pos.y, 18, 0, Math.PI * 2); ctx.fill();\n      ctx.fillStyle = '#fff';\n      ctx.beginPath(); ctx.arc(pos.x, pos.y, p.size, 0, Math.PI * 2); ctx.fill();\n    }\n\n    // vignette on top\n    ctx.fillStyle = vg;\n    ctx.fillRect(0, 0, w, h);\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
